name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm gate:sku15
      - name: Verify tag and ancestry
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v$v"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pkg="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          if npm view "$pkg@$ver" version >/dev/null 2>&1; then
            echo "$pkg@$ver is already public; skipping publish"
          else
            npm publish --provenance --access public --tag next
          fi
          npm dist-tag add "$pkg@$ver" alpha
          npm dist-tag add "$pkg@$ver" latest
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          npx --yes @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file dist/sbom.cdx.json
          cp ACCEPTANCE.csv EVIDENCE.md dist/ 2>/dev/null || true
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: true
          files: dist/*
